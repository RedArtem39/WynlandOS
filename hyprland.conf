# WynlandOS - Official Hyprland Native Port Configuration (/hyprland.conf)
# ======================================================================
# This configuration file is 100% compatible with upstream Vaxry/Hyprland parameters
# and configures both the Dwindle (binary tiling) and Master (stacking) engines.

general {
    gaps_in = 12
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(2e3440ff)
    layout = dwindle
}

decoration {
    rounding = 16
    blur = true
    blur_size = 8
    drop_shadow = true
    shadow_range = 24
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    use_active_for_splits = true
    split_width_multiplier = 1.2
    default_split_ratio = 0.5
    force_split = 0
    permanent_direction_override = false
    split_bias = 0
    smart_resizing = true
    special_scale_factor = 0.8
}

master {
    allow_small_split = false
    special_scale_factor = 0.8
    mfact = 0.55
    new_status = slave
    new_on_top = false
    new_on_active = none
    orientation = left
    slave_count_for_center_master = 2
    center_master_fallback = left
    center_ignores_reserved = false
    smart_resizing = true
    drop_at_cursor = true
    always_keep_position = false
    focus_master_on_close = false
}
