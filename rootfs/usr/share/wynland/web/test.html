<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WynlandOS WPE check</title>
<style>
  body { margin: 0; font: 18px/1.4 sans-serif; background: #f4f4f4; color: #222; }
  header { padding: 24px 32px; background: linear-gradient(90deg, #2b5876, #4e4376); color: #fff; }
  h1 { margin: 0; font-size: 32px; }
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px 32px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .card h2 { margin: 0 0 8px; font-size: 20px; }
  #js { font-weight: bold; color: #b00; }
  #js.ok { color: #080; }
  .spin { width: 60px; height: 60px; border: 8px solid #ccc; border-top-color: #4e4376; border-radius: 50%;
          animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header><h1>WPE WebKit on WynlandOS</h1><div>Привет, мир · مرحبا · こんにちは</div></header>
<main>
  <div class="card"><h2>JavaScript</h2><div id="js">JS did not run</div></div>
  <div class="card"><h2>Canvas</h2><canvas id="c" width="260" height="120"></canvas></div>
  <div class="card"><h2>SVG</h2>
    <svg width="260" height="120" viewBox="0 0 260 120">
      <circle cx="60" cy="60" r="50" fill="#e94e77"/>
      <rect x="130" y="15" width="100" height="90" rx="12" fill="#3fb0ac"/>
    </svg>
  </div>
  <div class="card"><h2>Animation</h2><div class="spin"></div></div>
  <div class="card"><h2>Grid &amp; flex</h2><div style="display:flex;gap:8px">
    <div style="flex:1;height:40px;background:#f6b352"></div>
    <div style="flex:2;height:40px;background:#6c5b7b"></div>
    <div style="flex:1;height:40px;background:#355c7d"></div></div></div>
  <div class="card"><h2>Engine</h2><div id="ua"></div></div>
</main>
<script>
  const js = document.getElementById('js');
  // a little real work for the JIT: primes below 200000
  let n = 0;
  for (let i = 2; i < 200000; i++) { let p = true; for (let d = 2; d * d <= i; d++) if (i % d === 0) { p = false; break; } if (p) n++; }
  js.textContent = 'JS OK: ' + n + ' primes below 200000';
  js.className = 'ok';
  const c = document.getElementById('c').getContext('2d');
  const g = c.createLinearGradient(0, 0, 260, 0);
  g.addColorStop(0, '#ff7e5f'); g.addColorStop(1, '#feb47b');
  c.fillStyle = g; c.fillRect(0, 0, 260, 120);
  c.fillStyle = '#fff'; c.font = 'bold 28px sans-serif'; c.fillText('canvas 2D', 50, 70);
  document.getElementById('ua').textContent = navigator.userAgent;
</script>
</body>
</html>
