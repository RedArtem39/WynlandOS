; WynlandOS: Ubuntu's Qt 6 lives in /lib64 here, so Qt's relocatable
; prefix (derived from libQt6Core's location) would point at the wrong
; tree. Pin the Ubuntu layout for every Qt program in /usr/bin.
[Paths]
Prefix=/usr
Libraries=/lib64
ArchData=lib/x86_64-linux-gnu/qt6
Plugins=lib/x86_64-linux-gnu/qt6/plugins
QmlImports=lib/x86_64-linux-gnu/qt6/qml
Data=share/qt6
Translations=share/qt6/translations
