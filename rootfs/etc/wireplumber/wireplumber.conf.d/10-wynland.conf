# WynlandOS - WirePlumber, PipeWire's session manager.
#
# Its device monitors look for cards through udev and /dev/snd, Bluetooth
# through BlueZ, cameras through V4L2 and libcamera: none of that is here
# (the sound card is a node made by PipeWire's own configuration,
# /etc/pipewire/pipewire.conf.d/10-wynland.conf). No logind either. It
# still does its real job: links programs to the output, keeps the
# default device and the volumes.
wireplumber.profiles = {
    main = {
        monitor.alsa = disabled
        monitor.alsa-midi = disabled
        monitor.bluez = disabled
        monitor.bluez.seat-monitoring = disabled
        monitor.v4l2 = disabled
        monitor.libcamera = disabled
        support.logind = disabled
    }
}
