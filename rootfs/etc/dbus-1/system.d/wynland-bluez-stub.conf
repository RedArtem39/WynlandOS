<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- WynlandOS: org.bluez is owned by /usr/lib/wynland/bluez-stub, a
     STAND-IN that reports "no adapters": there is no Bluetooth on this
     system (apps/bluez-stub/bluez-stub.c). Replace with Ubuntu's bluez
     policy when real Bluetooth comes. -->
<busconfig>
  <policy user="root">
    <allow own="org.bluez"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
