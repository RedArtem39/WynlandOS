# WynlandOS - alsa-lib's configuration.
#
# The HD Audio output is an OSS /dev/dsp (drivers/sound/hda.c): alsa-lib
# reaches it through the OSS plugin of libasound2-plugins, as "wynhda" --
# PipeWire's own output node uses that (/etc/pipewire/pipewire.conf.d).
# Programs that use ALSA themselves go through PipeWire (pipewire-alsa's
# pcm.pipewire), so they mix with everything else.
pcm.wynhda {
    type oss
    device /dev/dsp
    hint.description "HD Audio (/dev/dsp)"
}
pcm.!default {
    type pipewire
    playback_node "-1"
    capture_node  "-1"
    hint.description "PipeWire"
}
ctl.!default {
    type pipewire
}
