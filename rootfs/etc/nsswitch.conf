# WynlandOS - where glibc looks names up.
#
# Without this file glibc asks DNS first and, told "no such name", never
# reads /etc/hosts: "localhost" went to the router and was not found (a
# Node server on this machine unreachable from curl and the browser).
passwd:    files
group:     files
shadow:    files
hosts:     files dns
networks:  files
protocols: files
services:  files
ethers:    files
rpc:       files
netgroup:  files
