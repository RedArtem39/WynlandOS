# WynlandOS - the HD Audio output as PipeWire's sink.
#
# No device monitor finds it (no udev, no /dev/snd: the card is an OSS
# /dev/dsp), so the node is made here: an ALSA sink on alsa-lib's "wynhda"
# (/etc/asound.conf: the OSS plugin over /dev/dsp). It drives the graph
# with the card's own clock. Read and write, not mmap: the OSS plugin has
# no mmap.
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "wynland-hda"
            node.description       = "Встроенный звук"
            media.class            = "Audio/Sink"
            api.alsa.path          = "wynhda"
            api.alsa.disable-mmap  = true
            api.alsa.period-size   = 1024
            audio.format           = "S16LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            priority.driver        = 1000
            priority.session       = 1000
            node.pause-on-idle     = false
        }
    }
]
