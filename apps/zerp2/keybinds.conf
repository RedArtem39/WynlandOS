# Zerp 2.0 key bindings (apps/zerp2/keybinds.h), Hyprland's classic syntax.
# Copy to ~/.config/zerp2/keybinds.conf to change them: that file then
# replaces this one.
#
# Caelestia's bindings (caelestia-dots/caelestia 639dd6e: hypr/hyprland/
# keybinds.lua and hypr/variables.lua), with WynlandOS's programs. Left out
# for now: what Zerp has no counterpart of (special workspaces, groups,
# floating, pinning, window resizing/dragging, mouse-wheel workspaces) and
# Caelestia's CLI tools that are not in the image (clipboard, emoji,
# screen recording, colour picker).

$terminal     = /usr/bin/term
$browser      = /usr/bin/web
$fileExplorer = /usr/bin/files
$editor       = /usr/bin/term -e nano

# Caelestia's shell: the launcher on Super alone (released with nothing
# pressed in between), its drawers and the lock screen
bindr = SUPER, SUPER_L, global, caelestia:launcher
bind  = CTRL ALT, Delete, global, caelestia:session
bind  = SUPER, N, global, caelestia:sidebar
bindl = CTRL ALT, C, global, caelestia:clearNotifs
bind  = SUPER, K, global, caelestia:showall
bind  = SUPER, L, global, caelestia:lock
bind  = SUPER SHIFT, S, global, caelestia:screenshotFreeze
bind  = SUPER SHIFT ALT, S, global, caelestia:screenshot

# workspaces 1-10, and the next/previous one
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, 1, movetoworkspace, 1
bind = SUPER ALT, 2, movetoworkspace, 2
bind = SUPER ALT, 3, movetoworkspace, 3
bind = SUPER ALT, 4, movetoworkspace, 4
bind = SUPER ALT, 5, movetoworkspace, 5
bind = SUPER ALT, 6, movetoworkspace, 6
bind = SUPER ALT, 7, movetoworkspace, 7
bind = SUPER ALT, 8, movetoworkspace, 8
bind = SUPER ALT, 9, movetoworkspace, 9
bind = SUPER ALT, 0, movetoworkspace, 10
bind = SUPER, Page_Down, workspace, +1
bind = SUPER, Page_Up, workspace, -1
bind = CTRL SUPER, Right, workspace, +1
bind = CTRL SUPER, Left, workspace, -1
bind = SUPER ALT, Page_Down, movetoworkspace, +1
bind = SUPER ALT, Page_Up, movetoworkspace, -1
bind = CTRL SUPER SHIFT, Right, movetoworkspace, +1
bind = CTRL SUPER SHIFT, Left, movetoworkspace, -1

# windows
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
bind = SUPER, F, fullscreen
bind = SUPER ALT, F, fullscreen
bind = SUPER, Q, killactive

# programs
bind = SUPER, T, exec, $terminal
bind = SUPER, Return, exec, $terminal
bind = SUPER, W, exec, $browser
bind = SUPER, E, exec, $fileExplorer
bind = SUPER, C, exec, $editor

# media and volume (the shell's player controls; PipeWire's wpctl)
bindl = CTRL SUPER, Space, global, caelestia:mediaToggle
bindl = CTRL SUPER, Equal, global, caelestia:mediaNext
bindl = CTRL SUPER, Minus, global, caelestia:mediaPrev
bindl = CTRL SUPER, Backspace, global, caelestia:mediaStop
bindl = SUPER SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Caelestia: kill / restart the shell
bindr = CTRL SUPER SHIFT, R, exec, qs -c caelestia kill
bindr = CTRL SUPER ALT, R, exec, qs -c caelestia kill; sleep .1; QT_QUICK_BACKEND=opengl quickshell -c caelestia > "$HOME/.cache/caelestia.log" 2>&1
